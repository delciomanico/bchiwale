server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

  # Configuração de runtime: nunca em cache
  location = /config.js { add_header Cache-Control "no-cache"; try_files $uri =404; }

  # Ficheiros com hash no nome: cache longa
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # Ficheiros estáticos soltos (robots, sitemap, ícones)
  location ~* \.(png|svg|ico|txt|xml)$ { expires 1d; try_files $uri =404; }

  # SPA (React Router): qualquer outra rota devolve index.html, sem cache
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
